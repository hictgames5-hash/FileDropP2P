<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FileDrop P2P - Transferência Rápida</title>
  <!-- PeerJS para conexão direta entre dispositivos via WebRTC -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Geneva, sans-serif; }
    *, *::before, *::after { animation: none !important; transition: none !important; box-shadow: none !important; }
    body { background-color: #f0f2f5; color: #222; padding: 15px; font-size: 14px; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; border: 1px solid #ccc; padding: 15px; border-radius: 4px; }
    h1 { font-size: 18px; text-align: center; margin-bottom: 15px; border-bottom: 2px solid #0056b3; padding-bottom: 8px; color: #0056b3; }
    .id-box { background: #e9ecef; border: 1px solid #ced4da; padding: 10px; text-align: center; margin-bottom: 15px; border-radius: 4px; }
    .id-value { font-size: 22px; font-weight: bold; color: #28a745; letter-spacing: 2px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; }
    input[type="text"], input[type="file"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 3px; font-size: 13px; }
    .btn { width: 100%; padding: 10px; background: #0056b3; color: #fff; border: none; font-weight: bold; cursor: pointer; border-radius: 3px; margin-top: 5px; }
    .btn:hover { background: #004085; }
    .btn-imp { background: #6f42c1; margin-top: 5px; text-align: center; text-decoration: none; display: block; color: white; padding: 8px; font-weight: bold; border-radius: 3px; }
    .progress-container { margin: 12px 0; display: none; }
    .progress-bar-bg { background: #e9ecef; border: 1px solid #ccc; height: 18px; width: 100%; border-radius: 3px; overflow: hidden; }
    .progress-bar-fill { background: #28a745; height: 100%; width: 0%; }
    .progress-text { font-size: 11px; text-align: center; margin-top: 3px; }
    .inbox { margin-top: 20px; border-top: 2px dashed #ccc; padding-top: 15px; }
    .inbox-title { font-weight: bold; margin-bottom: 10px; color: #333; }
    .file-card { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
    .file-meta { font-size: 11px; color: #666; margin-bottom: 5px; }
    .file-note { font-style: italic; background: #fff; border: 1px solid #eee; padding: 5px; margin: 5px 0; }
    .media-preview { margin: 8px 0; max-width: 100%; text-align: center; }
    .media-preview img, .media-preview video { max-width: 100%; max-height: 250px; border: 1px solid #ccc; }
    .media-preview audio { width: 100%; }
    #toast { position: fixed; bottom: 10px; left: 10px; right: 10px; max-width: 480px; margin: 0 auto; background: #323232; color: #fff; padding: 10px 12px; display: none; border-radius: 3px; font-size: 12px; z-index: 999; }
    #toast-close { background: #dc3545; color: #fff; border: none; font-weight: bold; width: 20px; height: 20px; cursor: pointer; float: right; margin-left: 10px; text-align: center; line-height: 18px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>FileDrop P2P</h1>

    <div class="id-box">
      <div>SEU CÓDIGO DE CONEXÃO:</div>
      <div id="my-id" class="id-value">Gerando...</div>
    </div>

    <div class="form-group">
      <label for="dest-id">Código do Destino (5 dígitos):</label>
      <input type="text" id="dest-id" placeholder="Ex: 12345" maxlength="5">
    </div>

    <div class="form-group">
      <label for="sender-name">Seu Nome/Apelido (Opcional):</label>
      <input type="text" id="sender-name" placeholder="Ex: Matheus">
    </div>

    <div class="form-group">
      <label for="file-note">Mensagem/Descrição (Opcional):</label>
      <input type="text" id="file-note" placeholder="Ex: Foto do projeto">
    </div>

    <div class="form-group">
      <label for="file-input">Selecione o(s) Arquivo(s):</label>
      <input type="file" id="file-input" multiple>
    </div>

    <div class="progress-container" id="progress-box">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-text" id="progress-text">0%</div>
    </div>

    <button class="btn" id="send-btn">ENVIAR ARQUIVO(S)</button>

    <div class="inbox">
      <div class="inbox-title">Arquivos Recebidos:</div>
      <div id="inbox-list"><div style="color:#888; font-size:12px;">Nenhum arquivo recebido ainda.</div></div>
    </div>
  </div>

  <div id="toast">
    <button id="toast-close" onclick="closeToast()">X</button>
    <span id="toast-msg"></span>
  </div>

  <script>
    // URL do seu IMP (cole seu link do IMP aqui)
    const IMP_URL = "https://seu-link-do-imp.onrender.com";

    let peer = null;
    let myId = "";

    function showToast(msg) {
      document.getElementById('toast-msg').innerText = msg;
      document.getElementById('toast').style.display = 'block';
    }

    function closeToast() {
      document.getElementById('toast').style.display = 'none';
    }

    // Gera ID aleatório de 5 dígitos numéricos
    function generate5DigitID() {
      return Math.floor(10000 + Math.random() * 90000).toString();
    }

    function initPeer() {
      myId = generate5DigitID();
      
      // Conecta ao servidor gratuito do PeerJS
      peer = new Peer(myId, { debug: 1 });

      peer.on('open', function(id) {
        document.getElementById('my-id').innerText = id;
      });

      peer.on('error', function(err) {
        if (err.type === 'unavailable-id') {
          // Se o ID sorteado já existir, tenta outro
          initPeer();
        } else {
          showToast("Erro na conexão: " + err.type);
        }
      });

      // Escuta conexões recebidas
      peer.on('connection', function(conn) {
        conn.on('data', function(data) {
          receiveFiles(data);
        });
      });
    }

    function sendFiles() {
      const destId = document.getElementById('dest-id').value.trim();
      const files = document.getElementById('file-input').files;
      const sender = document.getElementById('sender-name').value.trim() || 'Anônimo';
      const note = document.getElementById('file-note').value.trim();

      if (!destId || destId.length !== 5) {
        showToast("Digite um código de destino válido com 5 dígitos!");
        return;
      }

      if (!files || files.length === 0) {
        showToast("Selecione pelo menos um arquivo para enviar!");
        return;
      }

      const progressBox = document.getElementById('progress-box');
      const progressFill = document.getElementById('progress-fill');
      const progressText = document.getElementById('progress-text');
      progressBox.style.display = 'block';

      // Abre conexão P2P com o destino
      const conn = peer.connect(destId);

      conn.on('open', function() {
        let filesProcessed = 0;
        const totalFiles = files.length;
        const payload = [];

        Array.from(files).forEach(file => {
          const reader = new FileReader();
          reader.onload = function(e) {
            payload.push({
              name: file.name,
              type: file.type,
              size: file.size,
              buffer: e.target.result,
              sender: sender,
              note: note
            });

            filesProcessed++;
            let pct = Math.round((filesProcessed / totalFiles) * 100);
            progressFill.style.width = pct + '%';
            progressText.innerText = pct + '%';

            if (filesProcessed === totalFiles) {
              conn.send(payload);
              showToast("Arquivo(s) enviado(s) com sucesso!");
              setTimeout(function() {
                progressBox.style.display = 'none';
                progressFill.style.width = '0%';
              }, 1500);
            }
          };
          reader.readAsArrayBuffer(file);
        });
      });

      conn.on('error', function(err) {
        showToast("Não foi possível conectar ao ID " + destId);
        progressBox.style.display = 'none';
      });
    }

    function receiveFiles(dataList) {
      const inboxList = document.getElementById('inbox-list');
      if (inboxList.children.length === 1 && inboxList.children[0].innerText.includes("Nenhum arquivo")) {
        inboxList.innerHTML = '';
      }

      const isDesktop = window.innerWidth > 600;

      dataList.forEach(item => {
        const blob = new Blob([item.buffer], { type: item.type });
        const fileUrl = URL.createObjectURL(blob);

        const card = document.createElement('div');
        card.className = 'file-card';

        let meta = `De: <b>${item.sender}</b> | Tamanho: ${(item.size / 1024).toFixed(1)} KB`;
        let noteHtml = item.note ? `<div class="file-note">"${item.note}"</div>` : '';
        
        let mediaHtml = '';
        const t = item.type.toLowerCase();

        if (t.startsWith('image/')) {
          mediaHtml = `<div class="media-preview"><img src="${fileUrl}" alt="Imagem"></div>`;
        } else if (t.startsWith('video/')) {
          mediaHtml = `<div class="media-preview"><video controls src="${fileUrl}"></video></div>`;
        } else if (t.startsWith('audio/')) {
          mediaHtml = `<div class="media-preview"><audio controls src="${fileUrl}"></audio></div>`;
        }

        let impBtn = '';
        if (isDesktop && (t.startsWith('audio/') || t.startsWith('video/'))) {
          impBtn = `<a href="${IMP_URL}" target="_blank" class="btn-imp">Abrir no IMP</a>`;
        }

        card.innerHTML = `
          <div><b>${item.name}</b></div>
          <div class="file-meta">${meta}</div>
          ${noteHtml}
          ${mediaHtml}
          <a href="${fileUrl}" download="${item.name}" class="btn" style="display:inline-block; text-align:center; text-decoration:none; width:auto; padding:5px 10px; font-size:12px;">Baixar Arquivo</a>
          ${impBtn}
        `;

        inboxList.appendChild(card);
      });

      showToast("Você recebeu novos arquivos!");
    }

    document.getElementById('send-btn').addEventListener('click', sendFiles);
    window.addEventListener('load', initPeer);
  </script>
</body>
</html>
