<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileDrop P2P - Transferência Ultra Leve</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Desativa animações globais para economizar CPU no Windows 7 x86 e Celulares Antigos */
        * {
            box-shadow: none !important;
            text-shadow: none !important;
            transition: none !important;
            animation: none !important;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        progress::-webkit-progress-bar {
            background-color: #1e293b;
            border-radius: 4px;
        }
        progress::-webkit-progress-value {
            background-color: #2563eb;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-6 text-sm relative pb-20">

    <!-- Header Responsivo com ID -->
    <header class="max-w-4xl w-full mx-auto bg-slate-900 border border-slate-800 rounded-lg p-3 sm:p-4 mb-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
        <div>
            <h1 class="text-lg sm:text-xl font-bold text-blue-400">FileDrop <span class="text-xs bg-blue-950 text-blue-300 border border-blue-800 px-2 py-0.5 rounded font-mono">P2P MULTI</span></h1>
            <p class="text-xs text-slate-400">Envio leve de múltiplos arquivos para PC e Celular</p>
        </div>
        
        <div class="w-full sm:w-auto bg-slate-950 border border-slate-800 px-3 py-2 rounded flex items-center justify-between sm:justify-start gap-3">
            <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400">Seu ID:</span>
                <span id="myDeviceId" class="font-mono text-base sm:text-lg font-bold text-cyan-400 tracking-wider">-----</span>
            </div>
            <button onclick="copyDeviceId()" class="bg-slate-800 hover:bg-slate-700 text-xs px-2 py-1 rounded border border-slate-700 text-slate-200 shrink-0">
                Copiar
            </button>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto grid grid-cols-1 md:grid-cols-2 gap-4 flex-grow">
        
        <!-- Formulário de Envio -->
        <section class="bg-slate-900 border border-slate-800 rounded-lg p-3 sm:p-4 space-y-3">
            <h2 class="font-semibold text-slate-200 border-b border-slate-800 pb-2 text-base">Enviar Arquivos</h2>

            <form onsubmit="handleSendFiles(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">ID do Destino (5 dígitos) *</label>
                    <input type="text" id="targetId" maxlength="5" placeholder="Ex: ABCDE" required
                        class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 font-mono text-cyan-300 uppercase tracking-widest text-base focus:border-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Seu Nome / Apelido (Opcional)</label>
                    <input type="text" id="senderName" placeholder="Ex: Celular ou PC do Quarto"
                        class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-slate-200 focus:border-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Selecionar Arquivo(s) *</label>
                    <input type="file" id="fileInput" multiple required onchange="handleFilesSelected(this)"
                        class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-900 file:text-blue-200 hover:file:bg-blue-800 cursor-pointer">
                    <div id="fileListPreview" class="mt-2 space-y-1 max-h-28 overflow-y-auto text-[11px] text-slate-400">
                        <p class="text-slate-500 italic">Nenhum arquivo selecionado</p>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Recado / Descrição (Opcional)</label>
                    <input type="text" id="fileNote" placeholder="Ex: Fotos e vídeos do projeto"
                        class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-slate-200 focus:border-blue-500 focus:outline-none">
                </div>

                <!-- Barra de Progresso Geral -->
                <div id="progressContainer" class="hidden space-y-1">
                    <div class="flex justify-between text-[11px] text-slate-400">
                        <span>Progresso do envio:</span>
                        <span id="progressText" class="font-mono text-blue-400">0%</span>
                    </div>
                    <progress id="progressBar" value="0" max="100" class="w-full h-2 rounded bg-slate-950"></progress>
                </div>

                <button type="submit" id="sendBtn" 
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded transition-none text-sm">
                    Enviar Tudo
                </button>
            </form>
        </section>

        <!-- Status e Caixa de Entrada -->
        <section class="space-y-4">
            
            <!-- Monitor de status de transmissão -->
            <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 sm:p-4">
                <h2 class="font-semibold text-slate-200 border-b border-slate-800 pb-2 text-base mb-3">Status de Envio</h2>
                <div id="transferLogs" class="space-y-2 max-h-28 overflow-y-auto text-xs">
                    <p class="text-slate-500 italic text-center py-2">Pronto para enviar.</p>
                </div>
            </div>

            <!-- Caixa de Entrada com Player / Preview -->
            <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 sm:p-4">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-3">
                    <h2 class="font-semibold text-slate-200 text-base">Arquivos Recebidos</h2>
                    <span id="receivedCount" class="text-xs bg-slate-800 text-slate-400 font-mono px-2 py-0.5 rounded">0</span>
                </div>
                <div id="receivedList" class="space-y-3 max-h-80 overflow-y-auto text-xs">
                    <p class="text-slate-500 italic text-center py-4">Nenhum arquivo recebido.</p>
                </div>
            </div>

        </section>

    </main>

    <!-- Caixa de Notificação de Texto Simples sem alert() -->
    <div id="toastBox" class="hidden fixed bottom-3 left-1/2 -translate-x-1/2 max-w-lg w-[92%] bg-slate-900 border border-slate-700 p-3 rounded flex items-center justify-between gap-3 z-50">
        <span id="toastText" class="text-xs text-slate-200 break-words flex-1"></span>
        <button onclick="hideToast()" class="bg-red-600 hover:bg-red-700 text-white font-bold w-6 h-6 rounded flex items-center justify-center shrink-0 text-xs">
            X
        </button>
    </div>

    <script>
        // LINK DO IMP: Cole a URL do seu reprodutor IMP entre as aspas abaixo
        const IMP_URL = "https://seu-link-do-imp.onrender.com"; 

        let myId = '';
        let selectedFiles = [];
        let receivedCount = 0;
        let channel = null;

        // Detecta se é um computador (desktop/laptop) baseado na largura da tela
        function isDesktop() {
            return window.innerWidth >= 768;
        }

        function generateId() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let id = '';
            for (let i = 0; i < 5; i++) {
                id += chars[Math.floor(Math.random() * chars.length)];
            }
            return id;
        }

        function showNotice(msg) {
            const toast = document.getElementById('toastBox');
            const toastText = document.getElementById('toastText');
            toastText.innerText = msg;
            toast.classList.remove('hidden');
        }

        function hideToast() {
            document.getElementById('toastBox').classList.add('hidden');
        }

        function initApp() {
            myId = generateId();
            const idElem = document.getElementById('myDeviceId');
            if (idElem) idElem.innerText = myId;

            if ('BroadcastChannel' in window) {
                channel = new BroadcastChannel('filedrop_ultra_channel');
                channel.onmessage = (e) => receiveData(e.data);
            }

            window.addEventListener('storage', (e) => {
                if (e.key === 'filedrop_payload' && e.newValue) {
                    try {
                        const data = JSON.parse(e.newValue);
                        receiveData(data);
                    } catch(err) {}
                }
            });
        }

        function copyDeviceId() {
            const input = document.createElement('input');
            input.value = myId;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            showNotice('Código ' + myId + ' copiado para a área de transferência!');
        }

        function handleFilesSelected(input) {
            const previewContainer = document.getElementById('fileListPreview');
            previewContainer.innerHTML = '';
            selectedFiles = Array.from(input.files || []);

            if (selectedFiles.length === 0) {
                previewContainer.innerHTML = '<p class="text-slate-500 italic">Nenhum arquivo selecionado</p>';
                return;
            }

            selectedFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'flex justify-between bg-slate-950 p-1.5 rounded border border-slate-800 text-slate-300';
                item.innerHTML = `
                    <span class="truncate max-w-[200px]">${index + 1}. ${file.name}</span>
                    <span class="text-slate-500 font-mono">${formatBytes(file.size)}</span>
                `;
                previewContainer.appendChild(item);
            });
        }

        function handleSendFiles(e) {
            e.preventDefault();

            const targetId = document.getElementById('targetId').value.trim().toUpperCase();
            const senderName = document.getElementById('senderName').value.trim() || ('Dispositivo ' + myId);
            const fileNote = document.getElementById('fileNote').value.trim();

            if (targetId.length !== 5) {
                showNotice('Erro: O ID do destino deve ter exatamente 5 caracteres.');
                return;
            }

            if (targetId === myId) {
                showNotice('Aviso: Você não pode enviar arquivos para seu próprio ID.');
                return;
            }

            if (selectedFiles.length === 0) {
                showNotice('Aviso: Por favor, selecione pelo menos um arquivo.');
                return;
            }

            const sendBtn = document.getElementById('sendBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50');
            progressContainer.classList.remove('hidden');

            let progress = 0;

            const interval = setInterval(() => {
                progress += 20;
                progressBar.value = progress;
                progressText.innerText = progress + '%';

                if (progress >= 100) {
                    clearInterval(interval);

                    selectedFiles.forEach(file => {
                        const objectUrl = URL.createObjectURL(file);
                        const payload = {
                            targetId: targetId,
                            senderId: myId,
                            senderName: senderName,
                            fileName: file.name,
                            fileSize: file.size,
                            fileType: file.type,
                            fileUrl: objectUrl,
                            note: fileNote,
                            time: new Date().toLocaleTimeString()
                        };

                        if (channel) channel.postMessage(payload);
                        localStorage.setItem('filedrop_payload', JSON.stringify(payload));

                        const logs = document.getElementById('transferLogs');
                        if (logs.innerText.includes('Pronto para enviar')) logs.innerHTML = '';

                        const logItem = document.createElement('div');
                        logItem.className = 'bg-slate-950 p-2 rounded border border-slate-800 text-slate-300';
                        logItem.innerHTML = `<strong>Enviado para ${targetId}:</strong> ${file.name} (${formatBytes(file.size)})`;
                        logs.prepend(logItem);
                    });

                    sendBtn.disabled = false;
                    sendBtn.classList.remove('opacity-50');
                    setTimeout(() => progressContainer.classList.add('hidden'), 1000);

                    showNotice('Sucesso: ' + selectedFiles.length + ' arquivo(s) enviado(s) para ' + targetId + '!');
                }
            }, 80);
        }

        function receiveData(data) {
            if (!data || data.targetId !== myId) return;

            const list = document.getElementById('receivedList');
            if (receivedCount === 0) list.innerHTML = '';

            receivedCount++;
            document.getElementById('receivedCount').innerText = receivedCount;

            const card = document.createElement('div');
            card.className = 'bg-slate-950 p-3 rounded border border-slate-800 space-y-2';

            const fileExt = data.fileName.split('.').pop().toLowerCase();
            const isImg = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'ico', 'svg', 'avif'].includes(fileExt) || data.fileType.startsWith('image/');
            const isAudio = ['mp3', 'wav', 'ogg', 'm4a', 'aac', 'flac'].includes(fileExt) || data.fileType.startsWith('audio/');
            const isVideo = ['mp4', 'webm', 'ogg', 'mkv'].includes(fileExt) || data.fileType.startsWith('video/');

            let previewHTML = '';

            // Player e Previews Nativos leves
            if (isImg) {
                previewHTML = `<div class="mt-2 bg-slate-900 p-1 rounded border border-slate-800 text-center">
                    <img src="${data.fileUrl}" alt="Preview" class="max-h-48 max-w-full mx-auto rounded object-contain">
                </div>`;
            } else if (isAudio) {
                previewHTML = `<div class="mt-2">
                    <audio controls class="w-full h-8">
                        <source src="${data.fileUrl}">
                        Seu navegador não suporta áudio.
                    </audio>
                </div>`;
            } else if (isVideo) {
                previewHTML = `<div class="mt-2 bg-slate-900 rounded overflow-hidden">
                    <video controls class="w-full max-h-48">
                        <source src="${data.fileUrl}">
                        Seu navegador não suporta vídeo.
                    </video>
                </div>`;
            }

            // Redirecionador para o IMP apenas em PC
            let impButtonHTML = '';
            if ((isAudio || isVideo) && isDesktop()) {
                const impTargetUrl = `${IMP_URL}?file=${encodeURIComponent(data.fileUrl)}&title=${encodeURIComponent(data.fileName)}`;
                impButtonHTML = `
                    <a href="${impTargetUrl}" target="_blank" 
                       class="bg-purple-700 hover:bg-purple-600 text-white font-medium px-3 py-1.5 rounded text-center block text-xs flex-1">
                       Abrir no IMP
                    </a>
                `;
            }

            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="font-semibold text-blue-400 truncate max-w-[200px]" title="${data.fileName}">${data.fileName}</span>
                    <span class="text-[10px] text-slate-500 font-mono">${formatBytes(data.fileSize)}</span>
                </div>
                <p class="text-[11px] text-slate-400">De: <strong class="text-slate-200">${data.senderName}</strong> (${data.senderId})</p>
                ${data.note ? `<p class="text-[11px] bg-slate-900 p-1.5 rounded text-slate-300 italic">"${data.note}"</p>` : ''}
                
                ${previewHTML}

                <div class="pt-2 border-t border-slate-900 flex flex-wrap gap-2">
                    <a href="${data.fileUrl}" download="${data.fileName}" 
                       class="bg-emerald-700 hover:bg-emerald-600 text-white font-medium px-3 py-1.5 rounded text-center block text-xs flex-1">
                       Baixar Arquivo
                    </a>
                    ${impButtonHTML}
                </div>
            `;

            list.prepend(card);
            showNotice('Novo arquivo recebido: ' + data.fileName);
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        initApp();
    </script>
</body>
</html>
